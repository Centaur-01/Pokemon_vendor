<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Verification</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; --accent: #2e7d32; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--card); width: 100%; max-width: 400px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* THE PICTURE PLACEHOLDER */
        .img-placeholder { width: 100%; aspect-ratio: 2.5/3.5; background: #3d3d3d; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; border-bottom: 1px solid #444; }
        
        .content { padding: 24px; }
        .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; font-weight: 700; margin-bottom: 4px; }
        .title { font-size: 22px; margin: 0 0 15px 0; line-height: 1.2; font-weight: 800; }
        
        .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        .spec-item { background: #3d3d3d; padding: 12px; border-radius: 8px; }
        .spec-val { font-weight: 600; font-size: 14px; }
        
        .price-section { background: var(--accent); padding: 20px; border-radius: 12px; text-align: center; }
        .asking-price { font-size: 42px; font-weight: 900; display: block; margin: 5px 0; }
    </style>
</head>

                </div>
            </div>

                <div class="label" style="color: #e8f5e9;">Asking Price</div>
                <span id="ui-price" class="asking-price">--</span>
            </div>
            
            <div style="margin-top:20px; font-size: 12px; color: #888; text-align: center;">
                Internal ID: <span id="ui-id">--</span>
            </div>
        </div>
    </div>
