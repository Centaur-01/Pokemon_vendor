<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Couples Collective TCG</title>
  <!-- PKM-031 forwarding front (2026-11-21, Jack: "make the switch, can both still run in paralell?").
       Every printed sticker encodes https://centaur-01.github.io/Pokemon_vendor/#<code>. This page sends that exact
       #code, unchanged, to the new customer store, which opens the same codes (sticker_scan: 3,913/3,913 right).
       The full original store keeps running beside it at classic.html (the pulse still updates it), and ?classic
       sends a visitor there instead. Revert = restore classic.html as index.html (one commit; price_diff.SITE_PAGE). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Couples Collective TCG" />
  <meta property="og:title" content="Couples Collective TCG" />
  <meta property="og:description" content="Pokémon singles and sealed, priced from real recent sales." />
  <meta property="og:url" content="https://centaur-01.github.io/Pokemon_vendor/" />
  <meta property="og:image" content="https://centaur-01.github.io/Pokemon_vendor/brand/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="brand/seal-32.png" />
  <script>
    (function () {
      var NEW = "https://centaur-01.github.io/couples-collective/";
      var hash = location.hash || "";                       // already URL-encoded exactly as printed
      var classic = /(^|[?&])classic(=|&|$)/.test(location.search);
      location.replace((classic ? "classic.html" : NEW) + hash);
    })();
  </script>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120e0b;color:#ede3d1;
    font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;text-align:center;padding:24px}a{color:#d4ad66}</style>
</head>
<body>
  <main>

    <p><a href="https://centaur-01.github.io/couples-collective/">Open the store</a> ·
       <a href="classic.html">Classic store</a></p>
  </main>
</body>
</html>
